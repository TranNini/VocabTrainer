<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Vocab">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <title>Vocab Trainer</title>
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<header class="top">
    <h1>Vocab Trainer</h1>
    <select id="language" class="language-select" aria-label="Language"></select>
</header>

<main>
    <p id="message" class="message" hidden></p>

    <!-- Quiz -->
    <section id="view-quiz" class="view">
        <div id="quiz-setup" class="card">
            <h2>Quiz</h2>
            <label for="quiz-category">Category</label>
            <select id="quiz-category"></select>
            <button id="quiz-start" class="primary">Start</button>
        </div>

        <div id="quiz-question" class="card" hidden>
            <div class="quiz-meta">
                <span id="quiz-progress"></span>
                <span id="quiz-score"></span>
            </div>
            <p id="quiz-direction" class="muted"></p>
            <div class="prompt-row">
                <p id="quiz-prompt" class="prompt"></p>
                <span id="quiz-prompt-ipa-toggle"></span>
            </div>
            <p id="quiz-prompt-ipa" class="ipa" hidden></p>
            <form id="quiz-form" autocomplete="off">
                <input id="quiz-answer" type="text" autocapitalize="off" autocorrect="off" spellcheck="false"
                       aria-label="Your answer">
                <div id="quiz-accents" class="accents" data-for="quiz-answer"></div>
                <p id="quiz-feedback" class="feedback" aria-live="polite"></p>
                <p id="quiz-full-answer" class="full-answer" hidden></p>
                <p id="quiz-context" class="note" hidden></p>
                <div id="quiz-extras" class="extras" hidden></div>
                <p id="quiz-answer-ipa" class="ipa" hidden></p>
                <div class="row">
                    <button id="quiz-check" type="submit" class="primary">Check</button>
                    <button id="quiz-next" type="button" class="primary" hidden>Next</button>
                    <button id="quiz-stop" type="button" class="secondary">Stop</button>
                </div>
            </form>
        </div>

        <div id="quiz-summary" class="card" hidden>
            <h2>Done!</h2>
            <p id="quiz-result" class="prompt"></p>
            <button id="quiz-again" class="primary">New quiz</button>
        </div>
    </section>

    <!-- Add -->
    <section id="view-add" class="view" hidden>
        <form id="add-form" class="card" autocomplete="off">
            <h2>Add vocab</h2>
            <label for="add-word" class="lang-name"></label>
            <input id="add-word" type="text" autocapitalize="off" autocorrect="off" spellcheck="false">
            <div class="accents" data-for="add-word"></div>
            <label for="add-english">English <span class="muted">(use / for alternatives)</span></label>
            <input id="add-english" type="text" autocapitalize="off" autocorrect="off" spellcheck="false">
            <label for="add-context">Context <span class="muted">(optional: rules, usage, exceptions)</span></label>
            <textarea id="add-context" rows="2" maxlength="500"
                      placeholder="e.g. irregular · only used formally · always followed by …"></textarea>
            <label for="add-category">Category</label>
            <select id="add-category" class="category-select"></select>
            <input id="add-new-category" type="text" placeholder="New category name" hidden>
            <button type="submit" class="primary">Add</button>
        </form>
        <div id="add-recent" class="card" hidden>
            <h3>Just added</h3>
            <ul id="add-recent-list" class="plain"></ul>
        </div>
    </section>

    <!-- Words -->
    <section id="view-words" class="view" hidden>
        <div class="card">
            <h2>Your vocab</h2>
            <div class="row">
                <select id="words-category" aria-label="Category"></select>
                <input id="words-search" type="search" placeholder="Search" autocapitalize="off"
                       autocorrect="off" spellcheck="false" aria-label="Search">
            </div>
            <nav id="words-letters" class="letters" aria-label="Jump to letter"></nav>
        </div>
        <div id="words-list"></div>
    </section>
</main>

<nav class="tabs" aria-label="Sections">
    <button data-view="quiz" class="active">Quiz</button>
    <button data-view="add">Add</button>
    <button data-view="words">Words</button>
</nav>

<template id="edit-template">
    <form class="edit" autocomplete="off">
        <div class="extras"></div>
        <label><span class="lang-name"></span> <input name="word" type="text" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
        <div class="accents"></div>
        <label>English <input name="english" type="text" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
        <label>Context <textarea name="context" rows="2" maxlength="500"></textarea></label>
        <label>Category <select name="category" class="category-select"></select></label>
        <input name="newCategory" type="text" placeholder="New category name" hidden>
        <div class="row">
            <button type="submit" class="primary">Save</button>
            <button type="button" data-action="cancel" class="secondary">Cancel</button>
            <button type="button" data-action="delete" class="danger">Delete</button>
        </div>
    </form>
</template>

<!-- ?v=2: one-time nudge for browsers still holding an old cached copy -->
<script src="app.js?v=2"></script>
</body>
</html>
