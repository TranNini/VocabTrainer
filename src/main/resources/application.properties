# Reachable from other devices on the same Wi-Fi (the iPhone); they need the access code
server.address=0.0.0.0
server.port=8080
# Redirects (after login, to the login page) as "/" rather than "http://host/": behind Caddy the app only
# sees http, and a browser on https://vocab.kulose.de would be sent to http://, which isn't reachable
server.tomcat.use-relative-redirects=true

# One folder per learner with one file per language, e.g. vocab/Nini/Spanish.txt
vocab.dir=vocab
# Gets the vocab saved before there were learners (vocab/Spanish.txt …), moved to vocab/Nini/ on the first start
vocab.first-learner=Nini
# The file from before languages existed; moved to vocab/Nini/Spanish.txt on the first start
vocab.old-file=vocab.txt

# Created on first start; delete it to get a new code (devices then need to log in again)
vocab.access-code-file=access-code.txt

# The jar gives every file the same 1980 date, so browsers (Safari on the iPhone) would keep
# old copies of app.js and style.css for years. Make them ask for the current file every time.
spring.web.resources.cache.use-last-modified=false
spring.web.resources.cache.cachecontrol.no-cache=true
